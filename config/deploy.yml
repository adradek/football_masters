# Имя сервиса. Используется для именования контейнеров и сети на сервере.
service: football_masters

# Имя образа на Docker Hub. Формат: <твой-username-на-docker-hub>/<имя-образа>.
image: shmoker/football_masters

# Серверы, на которые деплоим. У нас один VPS, роль web.
servers:
  web:
    - 134.209.72.219

# Reverse-proxy с автоматическим SSL через Let's Encrypt.
# host должен указывать (DNS A-запись) на IP сервера выше, иначе сертификат не выпустится.
proxy:
  ssl: true
  host: worldcup.odradek.today

# Где храним образы — Docker Hub.
registry:
  # server можно не указывать: по умолчанию это и есть Docker Hub (docker.io).
  username: shmoker
  # Пароль берётся из .kamal/secrets — НИКОГДА не пиши его сюда в открытом виде.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Переменные окружения внутри контейнера.
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Запускать Solid Queue прямо внутри Puma (ок для одного сервера).
    SOLID_QUEUE_IN_PUMA: true
    # Количество ядер под приложение (раскомментируй при необходимости).
    # WEB_CONCURRENCY: 2

# Удобные команды: bin/kamal console / shell / logs / dbc
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# ВАЖНО для SQLite: постоянный том, чтобы база не пропадала между деплоями.
volumes:
  - "football_masters_storage:/rails/storage"

# Мостит fingerprint-ассеты между версиями, чтобы не ловить 404 при выкатке.
asset_path: /rails/public/assets

# Сборка образа. amd64 — типичная архитектура VPS.
builder:
  arch: amd64
